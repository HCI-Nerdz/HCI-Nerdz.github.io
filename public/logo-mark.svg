<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="HCI Nerdz eye">
  <defs>
    <linearGradient id="bg" x1="24" y1="12" x2="232" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1218" />
      <stop offset="1" stop-color="#1A2330" />
    </linearGradient>
    <linearGradient id="eyeGlow" x1="70" y1="70" x2="186" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D9B8F" stop-opacity=".55" />
      <stop offset="1" stop-color="#E8A54B" stop-opacity=".35" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)" />

  <!-- Eye (logo): attention + look-aware interaction -->
  <path
    d="M38 132
       C60 82 100 60 128 60
       C156 60 196 82 218 132
       C196 190 156 210 128 210
       C100 210 60 190 38 132 Z"
    fill="rgba(232,228,217,0.10)"
    stroke="url(#eyeGlow)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Iris -->
  <circle cx="128" cy="134" r="28" fill="rgba(232,165,75,0.18)" />
  <circle cx="128" cy="134" r="18" fill="rgba(232,165,75,0.78)" />

  <!-- Pupil -->
  <circle cx="128" cy="134" r="10" fill="#0E1218" />
  <circle cx="123" cy="129" r="4" fill="#E8E4D9" opacity="0.9" />
</svg>