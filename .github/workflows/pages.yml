name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out canonical diagram sources
        uses: actions/checkout@v4
        with:
          repository: HCI-Nerdz/docs
          path: .diagram-sources/hci-docs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install and build
        env:
          HCI_DOCS_ROOT: ${{ github.workspace }}/.diagram-sources/hci-docs/docs/modules/ROOT/images
        run: |
          pnpm install --frozen-lockfile
          pnpm exec puppeteer browsers install chrome-headless-shell
          pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
